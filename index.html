<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Gambar ke Google Drive</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            text-align: center;
            font-size: 22px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: 600;
            font-size: 14px;
        }
        input[type="text"],
        input[type="email"],
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd1d9;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="number"]:focus {
            border-color: #3498db;
        }
        .file-drop-area {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 25px 15px;
            border: 2px dashed #3498db;
            border-radius: 8px;
            background-color: #f8fbff;
            transition: 0.3s;
            cursor: pointer;
            text-align: center;
            flex-direction: column;
        }
        .file-drop-area:hover {
            background-color: #eaf3fd;
        }
        .file-msg {
            color: #3498db;
            font-size: 14px;
            font-weight: 500;
            margin-top: 10px;
        }
        input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 100%;
            cursor: pointer;
            opacity: 0;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: background-color 0.3s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(52, 152, 219, 0.2);
        }
        button:hover {
            background-color: #2980b9;
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            box-shadow: none;
        }
        #status {
            margin-top: 20px;
            font-size: 14px;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block !important; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block !important; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; display: block !important; }
        #fileList {
            margin-top: 10px;
            font-size: 13px;
            color: #666;
            text-align: left;
            max-height: 120px;
            overflow-y: auto;
            padding-left: 20px;
        }
        #fileList li {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Upload Dokumen</h2>
        <form id="uploadForm">
            
            <div class="form-group">
                <label for="namaPemilik">Alamat Email</label>
                <input type="email" id="namaPemilik" name="nama" placeholder="Cth: nama@email.com" required>
            </div>

            <div class="form-group">
                <label for="totalJam">Total Jam</label>
                <input type="number" id="totalJam" name="jam" placeholder="Cth: 8" required>
            </div>

            <div class="form-group">
                <label>Upload semua SS-an Laporan kesini</label>
                <div class="file-drop-area">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#3498db" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    <span class="file-msg">Ketuk untuk pilih file gambar</span>
                    <input type="file" id="file" name="file" accept="image/*" multiple required>
                </div>
                <ul id="fileList"></ul>
            </div>

            <button type="submit" id="submitBtn">Kirim Sekarang</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        // URL WEB APP ANDA TETAP SAMA
        const scriptURL = 'https://script.google.com/macros/s/AKfycbz9_vG2DCW6hTEojg6lEeivcLaGWPkG1FKqb26wsd0f9KeTbCLgjw5CNDeHITKHTmFa/exec'; 

        const form = document.getElementById('uploadForm');
        const statusDiv = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');
        const fileInput = document.getElementById('file');
        const fileList = document.getElementById('fileList');

        // Update list file saat dipilih
        fileInput.addEventListener('change', () => {
            fileList.innerHTML = '';
            Array.from(fileInput.files).forEach(file => {
                const li = document.createElement('li');
                li.textContent = file.name;
                fileList.appendChild(li);
            });
            
            if (fileInput.files.length > 0) {
                document.querySelector('.file-msg').textContent = fileInput.files.length + " file terpilih";
            } else {
                document.querySelector('.file-msg').textContent = "Ketuk untuk pilih file gambar";
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('namaPemilik').value.trim();
            const jam = document.getElementById('totalJam').value.trim();
            const files = fileInput.files;
            
            if (!email) return;
            if (!jam) return;
            if (files.length === 0) return;

            // Menggabungkan Email dan Total Jam agar Google Apps Script membuat folder dengan nama ini
            // Contoh hasil: "budi@email.com (8 Jam)"
            const namaDigabung = `${email} (${jam} Jam)`;

            submitBtn.disabled = true;
            let successCount = 0;
            let errorCount = 0;

            // Proses upload satu per satu agar tidak berat / error koneksi
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                showStatus(`Mengupload file ${i + 1} dari ${files.length} (${file.name})...`, "info");
                
                try {
                    const base64 = await readFileAsBase64(file);
                    const obj = {
                        nama: namaDigabung,
                        filename: file.name,
                        mimeType: file.type,
                        bytes: base64
                    };

                    const response = await fetch(scriptURL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(obj)
                    });
                    
                    const data = await response.json();
                    
                    if(data.result === 'success') {
                        successCount++;
                    } else {
                        console.error("Server Error:", data.error);
                        errorCount++;
                        alert(`Gagal upload "${file.name}":\nDitolak Google karena: ${data.error}`);
                    }
                } catch (error) {
                    console.error("Fetch Error:", error);
                    errorCount++;
                    alert(`Gagal upload "${file.name}":\nKoneksi internet terputus atau batas limit Google tercapai.`);
                }
                
                // Jeda 1.5 detik agar Google Drive tidak kewalahan (menghindari error batas limit)
                await new Promise(resolve => setTimeout(resolve, 1500));
            }

            // Status akhir
            if (errorCount === 0) {
                showStatus(`Selesai! ${successCount} gambar berhasil masuk ke Drive.`, "success");
                form.reset();
                fileList.innerHTML = '';
                document.querySelector('.file-msg').textContent = "Ketuk untuk pilih file gambar";
            } else {
                showStatus(`Selesai, tapi ada ${errorCount} file gagal. Silakan coba lagi.`, "error");
            }
            
            submitBtn.disabled = false;
        });

        function showStatus(msg, type) {
            statusDiv.className = type;
            statusDiv.innerHTML = msg;
        }

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
